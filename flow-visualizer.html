<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Concierge - Flow Visualizer</title>
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1f2937;
    --border: #374151;
    --text: #f9fafb;
    --text-muted: #9ca3af;
    --accent: #6366f1;
    --accent2: #8b5cf6;
    --col-audio-in: #22d3ee;
    --col-audio-out: #d946ef;
    --col-ctrl: #ffffff;
    --col-tool: #34d399;
    --col-db: #a78bfa;
    --col-prompt: #facc15;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
  }
  header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.02em; }
  header .badge {
    font-size: 0.7rem; padding: 2px 8px; border-radius: 999px;
    background: var(--accent); color: #fff; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .main { display: flex; flex: 1; overflow: hidden; }
  .topology { flex: 1; position: relative; overflow: hidden; background: var(--bg); }
  #topo-svg { width: 100%; height: 100%; }
  .cluster-rect { fill: none; stroke-width: 1.5; stroke-dasharray: 6 4; opacity: 0.45; }
  .cluster-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.55; }
  .edge { fill: none; stroke-width: 2; opacity: 0.55; transition: opacity 0.4s, stroke-width 0.4s; }
  .edge.active { opacity: 1; stroke-width: 3; }
  .edge-label { font-size: 9px; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
  .edge-label.active { opacity: 0.8; }
  .node-group { cursor: default; }
  .node-bg {
    fill: var(--surface2); stroke: var(--border); stroke-width: 1.5;
    transition: fill 0.3s, stroke 0.3s, filter 0.3s;
  }
  .node-group.active .node-bg { stroke-width: 2.5; filter: drop-shadow(0 0 10px currentColor); }
  .node-icon { font-size: 20px; text-anchor: middle; dominant-baseline: central; pointer-events: none; user-select: none; }
  .node-label { font-size: 10px; font-weight: 600; text-anchor: middle; fill: var(--text); pointer-events: none; }
  .node-sublabel { font-size: 8px; text-anchor: middle; fill: var(--text-muted); pointer-events: none; }
  .side {
    width: 360px; min-width: 320px; background: var(--bg);
    border-left: 1px solid var(--border); display: flex; flex-direction: column;
    overflow: hidden; padding: 16px; gap: 12px;
  }
  /* Top control buttons */
  .side-controls {
    display: flex; gap: 10px; justify-content: center;
  }
  .side-controls button {
    flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 10px 0; cursor: pointer; font-size: 0.9rem; font-weight: 600;
    transition: background 0.2s, border-color 0.2s;
  }
  .side-controls button:hover { background: var(--accent); border-color: var(--accent); }
  /* Speed control */
  .speed-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 14px;
  }
  .speed-label { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
  .speed-val { font-size: 0.72rem; font-weight: 700; color: var(--text); min-width: 28px; text-align: right; }
  #speed-slider {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 2px; background: var(--border); outline: none; cursor: pointer;
  }
  #speed-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
  }
  #speed-slider::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: none;
  }
  /* Step card */
  .step-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; overflow: hidden;
  }
  .step-number {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-muted);
  }
  .step-title { font-size: 1.1rem; font-weight: 600; line-height: 1.25; color: var(--text); }
  .step-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .step-body { font-size: 0.74rem; color: var(--text-muted); line-height: 1.65; }
  .step-body .hl { color: #7ab8ff; font-weight: 600; }
  .step-meta { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 0.66rem; line-height: 1.8; font-family: ui-monospace, 'JetBrains Mono', monospace; }
  .meta-row { display: flex; gap: 8px; }
  .meta-key { color: var(--text-muted); min-width: 80px; flex-shrink: 0; }
  .meta-val { color: var(--text); word-break: break-all; font-weight: 600; }
  /* Nav buttons row */
  .step-nav-row {
    display: flex; gap: 8px; align-items: center; margin-top: 4px;
  }
  .step-nav-row button {
    flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 10px 0; cursor: pointer; font-size: 1rem;
    transition: background 0.2s; line-height: 1;
  }
  .step-nav-row button:hover { background: var(--surface); border-color: var(--accent); }
  .step-nav-row button:disabled { opacity: 0.3; cursor: not-allowed; }
  .step-nav-row button.play-btn { background: var(--accent); border-color: var(--accent); color: #fff; font-size: 1.1rem; }
  .step-nav-row button.play-btn:hover { background: #4f46e5; }
  /* Progress bar */
  .progress-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0; transition: width 0.35s; }
  /* All steps list */
  .all-steps-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;
    max-height: 260px; overflow: hidden;
  }
  .all-steps-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
  .steps-list { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .step-row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 8px; border-radius: 8px; cursor: pointer;
    font-size: 0.82rem; color: var(--text-muted); transition: background 0.15s, color 0.15s;
  }
  .step-row:hover { background: rgba(99,102,241,.1); color: var(--text); }
  .step-row.active { background: rgba(99,102,241,.18); color: var(--text); }
  .step-row-num {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    background: var(--surface2); color: var(--text-muted);
    font-size: 0.68rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, color 0.2s;
  }
  .step-row.active .step-row-num { background: var(--accent); color: #fff; }
  .step-row.done .step-row-num { background: var(--accent2); color: #fff; }
  /* Legend */
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 10px 16px; border-top: 1px solid var(--border); }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.7rem; color: var(--text-muted); }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<header>
  <span style="font-size:1.4rem">&#9992;&#65039;</span>
  <h1>Travel Concierge &mdash; Interactive Flow Visualizer</h1>
  <span class="badge">AgentCore + Nova Sonic 2</span>
</header>
<div class="main">
  <div class="topology">
    <svg id="topo-svg" viewBox="0 0 1100 560" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="arr-ctrl"      markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ffffff"/></marker>
        <marker id="arr-audio-in"  markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#22d3ee"/></marker>
        <marker id="arr-audio-out" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#d946ef"/></marker>
        <marker id="arr-tool"      markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#34d399"/></marker>
        <marker id="arr-db"        markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#a78bfa"/></marker>
        <marker id="arr-prompt"    markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#facc15"/></marker>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- CLUSTERS -->
      <rect class="cluster-rect" x="20"  y="60" width="170" height="490" rx="12" ry="12" stroke="#6366f1"/>
      <text class="cluster-label" x="105" y="52" text-anchor="middle" fill="#6366f1">Customer</text>
      <rect class="cluster-rect" x="210" y="60" width="360" height="490" rx="12" ry="12" stroke="#8b5cf6"/>
      <text class="cluster-label" x="390" y="52" text-anchor="middle" fill="#8b5cf6">Bedrock AgentCore</text>
      <rect class="cluster-rect" x="590" y="60" width="490" height="490" rx="12" ry="12" stroke="#34d399"/>
      <text class="cluster-label" x="835" y="52" text-anchor="middle" fill="#34d399">Backend</text>

      <!-- EDGES -->
      <!-- 1. browser -> cognito (vertical UP) -->
      <line id="e-browser-cognito"      class="edge" x1="105" y1="260" x2="105" y2="200" stroke="#ffffff" marker-end="url(#arr-ctrl)"/>
      <!-- 2. cognito -> browser (vertical DOWN, offset x -15) -->
      <line id="e-cognito-browser"      class="edge" x1="90"  y1="200" x2="90"  y2="260" stroke="#ffffff" marker-end="url(#arr-ctrl)"/>
      <!-- 3. browser -> agentcore_runtime (horizontal right) -->
      <line id="e-browser-runtime"      class="edge" x1="160" y1="300" x2="255" y2="300" stroke="#ffffff" marker-end="url(#arr-ctrl)"/>
      <!-- 4. agentcore_runtime -> browser (horizontal left, offset y +16) -->
      <line id="e-runtime-browser"      class="edge" x1="255" y1="316" x2="160" y2="316" stroke="#d946ef" marker-end="url(#arr-audio-out)"/>
      <!-- 5. agentcore_runtime -> nova_sonic (vertical UP) -->
      <line id="e-runtime-sonic"        class="edge" x1="300" y1="260" x2="300" y2="200" stroke="#22d3ee" marker-end="url(#arr-audio-in)"/>
      <!-- 6. nova_sonic -> agentcore_runtime (vertical DOWN, offset x +20) -->
      <line id="e-sonic-runtime"        class="edge" x1="320" y1="200" x2="320" y2="260" stroke="#d946ef" marker-end="url(#arr-audio-out)"/>
      <!-- 7. agentcore_runtime -> agentcore_gateway (horizontal right) -->
      <line id="e-runtime-gateway"      class="edge" x1="365" y1="300" x2="415" y2="300" stroke="#34d399" marker-end="url(#arr-tool)"/>
      <!-- 8. agentcore_gateway -> api_gateway (horizontal right) -->
      <line id="e-gateway-apigw"        class="edge" x1="525" y1="300" x2="605" y2="300" stroke="#34d399" marker-end="url(#arr-tool)"/>
      <!-- 9. api_gateway -> lambdas (horizontal right) -->
      <line id="e-apigw-lambdas"        class="edge" x1="715" y1="300" x2="780" y2="300" stroke="#34d399" marker-end="url(#arr-tool)"/>
      <!-- 10. lambdas -> dynamodb (horizontal right) -->
      <line id="e-lambdas-ddb"          class="edge" x1="890" y1="300" x2="955" y2="300" stroke="#a78bfa" marker-end="url(#arr-db)"/>
      <!-- 11. lambdas -> knowledge_base (vertical UP) -->
      <line id="e-lambdas-kb"           class="edge" x1="835" y1="260" x2="835" y2="200" stroke="#34d399" marker-end="url(#arr-tool)"/>
      <!-- 12. knowledge_base -> nova_lite (horizontal right) -->
      <line id="e-kb-lite"              class="edge" x1="715" y1="160" x2="780" y2="160" stroke="#facc15" marker-end="url(#arr-prompt)"/>
      <!-- 13. nova_lite -> knowledge_base (horizontal left, offset y +16) -->
      <line id="e-lite-kb"              class="edge" x1="780" y1="176" x2="715" y2="176" stroke="#facc15" marker-end="url(#arr-prompt)"/>
      <!-- 14. knowledge_base -> lambdas return (vertical DOWN, offset x -15) -->
      <line id="e-kb-lambdas"           class="edge" x1="820" y1="200" x2="820" y2="260" stroke="#34d399" marker-end="url(#arr-tool)"/>
      <!-- 15. lambdas -> api_gateway return (horizontal left, offset y +16) -->
      <line id="e-lambdas-apigw-ret"    class="edge" x1="780" y1="316" x2="715" y2="316" stroke="#34d399" marker-end="url(#arr-tool)"/>
      <!-- 16. api_gateway -> agentcore_gateway return (horizontal left, offset y +16) -->
      <line id="e-apigw-gateway-ret"    class="edge" x1="605" y1="316" x2="525" y2="316" stroke="#34d399" marker-end="url(#arr-tool)"/>
      <!-- 17. agentcore_gateway -> agentcore_runtime return (horizontal left, offset y +16) -->
      <line id="e-gateway-runtime-ret"  class="edge" x1="415" y1="316" x2="365" y2="316" stroke="#34d399" marker-end="url(#arr-tool)"/>
      <!-- 18. runtime -> browser escalation (horizontal left, offset y +32) -->
      <line id="e-runtime-browser-esc"  class="edge" x1="255" y1="332" x2="160" y2="332" stroke="#ffffff" marker-end="url(#arr-ctrl)"/>
      <!-- 19. browser -> live_agent (vertical DOWN) -->
      <line id="e-browser-agent"        class="edge" x1="105" y1="340" x2="105" y2="400" stroke="#ffffff" marker-end="url(#arr-ctrl)"/>

      <!-- EDGE LABELS -->
      <text id="el-browser-cognito"     class="edge-label" x="119" y="232" fill="#ffffff">auth req</text>
      <text id="el-cognito-browser"     class="edge-label" x="73"  y="232" fill="#ffffff">JWT+creds</text>
      <text id="el-browser-runtime"     class="edge-label" x="207" y="292" fill="#ffffff" text-anchor="middle">WSS in</text>
      <text id="el-runtime-browser"     class="edge-label" x="207" y="326" fill="#d946ef" text-anchor="middle">WSS out</text>
      <text id="el-runtime-sonic"       class="edge-label" x="286" y="234" fill="#22d3ee" text-anchor="end">audio-in</text>
      <text id="el-sonic-runtime"       class="edge-label" x="334" y="234" fill="#d946ef">audio-out</text>
      <text id="el-runtime-gateway"     class="edge-label" x="390" y="292" fill="#34d399" text-anchor="middle">MCP</text>
      <text id="el-gateway-apigw"       class="edge-label" x="565" y="292" fill="#34d399" text-anchor="middle">REST/IAM</text>
      <text id="el-apigw-lambdas"       class="edge-label" x="747" y="292" fill="#34d399" text-anchor="middle">invoke</text>
      <text id="el-lambdas-ddb"         class="edge-label" x="922" y="292" fill="#a78bfa" text-anchor="middle">read/write</text>
      <text id="el-lambdas-kb"          class="edge-label" x="849" y="234" fill="#34d399">query</text>
      <text id="el-kb-lite"             class="edge-label" x="747" y="152" fill="#facc15" text-anchor="middle">prompt</text>
      <text id="el-lite-kb"             class="edge-label" x="747" y="187" fill="#facc15" text-anchor="middle">response</text>
      <text id="el-kb-lambdas"          class="edge-label" x="834" y="234" fill="#34d399" text-anchor="end">answer</text>
      <text id="el-browser-agent"       class="edge-label" x="119" y="372" fill="#ffffff">call pickup</text>
      <!-- NODES -->
      <!-- cognito: x=105, y=160 -->
      <g id="node-cognito" class="node-group" transform="translate(105,160)">
        <rect class="node-bg" x="-55" y="-40" width="110" height="80" rx="10" ry="10" style="stroke:#6366f1"/>
        <text class="node-icon" y="-8">&#128274;</text>
        <text class="node-label" y="14">Amazon Cognito</text>
        <text class="node-sublabel" y="28">JWT + Identity Pool</text>
      </g>
      <!-- browser: x=105, y=300 -->
      <g id="node-browser" class="node-group" transform="translate(105,300)">
        <rect class="node-bg" x="-55" y="-40" width="110" height="80" rx="10" ry="10" style="stroke:#6366f1"/>
        <text class="node-icon" y="-8">&#127760;</text>
        <text class="node-label" y="14">Browser / App</text>
        <text class="node-sublabel" y="28">React + WebSocket</text>
      </g>
      <!-- live_agent: x=105, y=440 -->
      <g id="node-live_agent" class="node-group" transform="translate(105,440)">
        <rect class="node-bg" x="-55" y="-40" width="110" height="80" rx="10" ry="10" style="stroke:#6366f1"/>
        <text class="node-icon" y="-8">&#128222;</text>
        <text class="node-label" y="14">Live Agent</text>
        <text class="node-sublabel" y="28">picks up the call</text>
      </g>
      <!-- nova_sonic: x=310, y=160 -->
      <g id="node-nova_sonic" class="node-group" transform="translate(310,160)">
        <rect class="node-bg" x="-55" y="-40" width="110" height="80" rx="10" ry="10" style="stroke:#d946ef"/>
        <text class="node-icon" y="-8">&#127897;&#65039;</text>
        <text class="node-label" y="14">Nova Sonic 2</text>
        <text class="node-sublabel" y="28">speech-to-speech</text>
      </g>
      <!-- agentcore_runtime: x=310, y=300 -->
      <g id="node-agentcore_runtime" class="node-group" transform="translate(310,300)">
        <rect class="node-bg" x="-55" y="-40" width="110" height="80" rx="10" ry="10" style="stroke:#8b5cf6"/>
        <text class="node-icon" y="-8">&#129302;</text>
        <text class="node-label" y="14">AgentCore Runtime</text>
        <text class="node-sublabel" y="28">Strands BidiAgent</text>
      </g>
      <!-- agentcore_gateway: x=470, y=300 -->
      <g id="node-agentcore_gateway" class="node-group" transform="translate(470,300)">
        <rect class="node-bg" x="-55" y="-40" width="110" height="80" rx="10" ry="10" style="stroke:#8b5cf6"/>
        <text class="node-icon" y="-8">&#128256;</text>
        <text class="node-label" y="14">AgentCore Gateway</text>
        <text class="node-sublabel" y="28">MCP protocol</text>
      </g>
      <!-- api_gateway: x=660, y=300 -->
      <g id="node-api_gateway" class="node-group" transform="translate(660,300)">
        <rect class="node-bg" x="-55" y="-40" width="110" height="80" rx="10" ry="10" style="stroke:#34d399"/>
        <text class="node-icon" y="-8">&#128682;</text>
        <text class="node-label" y="14">API Gateway</text>
        <text class="node-sublabel" y="28">REST + AWS_IAM</text>
      </g>
      <!-- knowledge_base: x=660, y=160 -->
      <g id="node-knowledge_base" class="node-group" transform="translate(660,160)">
        <rect class="node-bg" x="-55" y="-40" width="110" height="80" rx="10" ry="10" style="stroke:#facc15"/>
        <text class="node-icon" y="-8">&#128218;</text>
        <text class="node-label" y="14">Knowledge Base</text>
        <text class="node-sublabel" y="28">Bedrock + vector</text>
      </g>
      <!-- lambdas: x=835, y=300 -->
      <g id="node-lambdas" class="node-group" transform="translate(835,300)">
        <rect class="node-bg" x="-55" y="-40" width="110" height="80" rx="10" ry="10" style="stroke:#34d399"/>
        <text class="node-icon" y="-8">&#9889;</text>
        <text class="node-label" y="14">Backend Lambdas</text>
        <text class="node-sublabel" y="28">18 functions</text>
      </g>
      <!-- nova_lite: x=835, y=160 -->
      <g id="node-nova_lite" class="node-group" transform="translate(835,160)">
        <rect class="node-bg" x="-55" y="-40" width="110" height="80" rx="10" ry="10" style="stroke:#facc15"/>
        <text class="node-icon" y="-8">&#10024;</text>
        <text class="node-label" y="14">Nova Lite</text>
        <text class="node-sublabel" y="28">KB gen model</text>
      </g>
      <!-- dynamodb: x=1010, y=300 -->
      <g id="node-dynamodb" class="node-group" transform="translate(1010,300)">
        <rect class="node-bg" x="-55" y="-40" width="110" height="80" rx="10" ry="10" style="stroke:#a78bfa"/>
        <text class="node-icon" y="-8">&#128451;&#65039;</text>
        <text class="node-label" y="14">DynamoDB</text>
        <text class="node-sublabel" y="28">Bookings, Seats</text>
      </g>

      <!-- PACKET LAYER -->
      <g id="packet-layer"></g>
    </svg>
  </div>

  <div class="side">
    <!-- Auto-play / Restart at top -->
    <div class="side-controls">
      <button id="btn-autoplay">&#9654; Auto-play</button>
      <button id="btn-restart">&#8634; Restart</button>
    </div>
    <!-- Speed slider -->
    <div class="speed-row">
      <span class="speed-label">&#9889; Speed</span>
      <input type="range" id="speed-slider" min="1" max="5" step="1" value="3">
      <span class="speed-val" id="speed-val">3x</span>
    </div>

    <!-- Step card -->
    <div class="step-card">
      <div class="step-number" id="step-counter">STEP 1 OF 14</div>
      <div class="step-title" id="step-title">Customer opens the app</div>
      <div class="step-scroll">

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let currentStep = 0;
let packetTimers = [];

// ─────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────
function getEdgeLine(edgeId) {
  return document.getElementById(edgeId);
}

function getEdgeEndpoints(edgeId) {
  const def = EDGES[edgeId];
  if (!def) return null;
  const from = NODE_POS[def.from];
  const to   = NODE_POS[def.to];
  return { x1: from.x, y1: from.y, x2: to.x, y2: to.y };
}

// ─────────────────────────────────────────────
//  SPEED HELPERS (top-level so firePacket can call them)
// ─────────────────────────────────────────────
function getPacketDuration() {
  const slider = document.getElementById('speed-slider');
  const v = slider ? parseInt(slider.value, 10) : 3;
  return Math.round(1800 - (v - 1) * 375); // 1x→1800ms, 3x→1050ms, 5x→300ms
}
function getAutoPlayInterval() {
  const slider = document.getElementById('speed-slider');
  const v = slider ? parseInt(slider.value, 10) : 3;
  return Math.round(5000 - (v - 1) * 875); // 1x→5000ms, 3x→3250ms, 5x→1500ms
}

// ─────────────────────────────────────────────
//  PACKET ANIMATION (requestAnimationFrame-based)
// ─────────────────────────────────────────────

// Active packet animations
const activePackets = new Set();

function clearPackets() {
  packetTimers.forEach(t => clearTimeout(t));
  packetTimers = [];
  activePackets.forEach(p => {
    if (p.el && p.el.parentNode) p.el.parentNode.removeChild(p.el);
    if (p.trailEl && p.trailEl.parentNode) p.trailEl.parentNode.removeChild(p.trailEl);
  });
  activePackets.clear();
}

function firePacket(edgeId, color) {
  const ep = getEdgeEndpoints(edgeId);
  if (!ep) return;
  const layer = document.getElementById('packet-layer');

  // Create glow circle
  const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  circle.setAttribute('r', '5');
  circle.setAttribute('fill', color);
  circle.setAttribute('filter', 'url(#glow)');

  // Create trail circle (slightly larger, more transparent)
  const trail = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  trail.setAttribute('r', '3');
  trail.setAttribute('fill', color);
  trail.setAttribute('opacity', '0.4');

  layer.appendChild(trail);
  layer.appendChild(circle);

  const startTime = performance.now();
  const duration = getPacketDuration(); // driven by speed slider

  const packet = { el: circle, trailEl: trail, done: false };
  activePackets.add(packet);

  function animate(now) {
    if (packet.done) return;
    const t = Math.min((now - startTime) / duration, 1);
    // Ease in-out cubic
    const ease = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;

    const x = ep.x1 + (ep.x2 - ep.x1) * ease;
    const y = ep.y1 + (ep.y2 - ep.y1) * ease;

    // Trail slightly behind
    const tTrail = Math.max(0, ease - 0.08);
    const tx = ep.x1 + (ep.x2 - ep.x1) * tTrail;
    const ty = ep.y1 + (ep.y2 - ep.y1) * tTrail;

    circle.setAttribute('cx', x);
    circle.setAttribute('cy', y);
    trail.setAttribute('cx', tx);
    trail.setAttribute('cy', ty);

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      packet.done = true;
      activePackets.delete(packet);
      try { layer.removeChild(circle); } catch(e) {}
      try { layer.removeChild(trail); } catch(e) {}
    }
  }

  requestAnimationFrame(animate);
}

function schedulePackets(packets) {
  packets.forEach(({ edge, count, delay }) => {
    const def = EDGES[edge];
    if (!def) return;
    const color = def.color;
    for (let i = 0; i < count; i++) {
      const t = setTimeout(() => firePacket(edge, color), delay + i * 200);
      packetTimers.push(t);
    }
  });
}

// ─────────────────────────────────────────────
//  RENDER STEP
// ─────────────────────────────────────────────
function renderStep(idx) {
  const step = STEPS[idx];

  // Clear previous state
  clearPackets();
  document.querySelectorAll('.node-group').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.edge').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.edge-label').forEach(e => e.classList.remove('active'));

  // Activate nodes
  step.nodes.forEach(id => {
    const el = document.getElementById('node-' + id);
    if (el) el.classList.add('active');
  });

  // Activate edges + labels
  step.edges.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.add('active');
    const lbl = document.getElementById('el-' + id.replace('e-', ''));
    if (lbl) lbl.classList.add('active');
  });

  // Fire packets
  schedulePackets(step.packets || []);

  // Update side panel
  document.getElementById('step-counter').textContent = `STEP ${idx + 1} OF ${STEPS.length}`;
  document.getElementById('step-title').textContent = step.title;
  document.getElementById('step-body').innerHTML = step.body;

  const metaEl = document.getElementById('step-meta');
  if (step.meta && step.meta.length) {
    metaEl.style.display = '';
    metaEl.innerHTML = step.meta.map(m =>
      `<div class="meta-row"><span class="meta-key">${m.k}</span><span class="meta-val">${m.v}</span></div>`
    ).join('');
  } else {
    metaEl.style.display = 'none';
  }

  // Progress bar
  const pct = STEPS.length > 1 ? (idx / (STEPS.length - 1)) * 100 : 100;
  document.getElementById('progress-fill').style.width = pct + '%';

  // Steps list
  document.querySelectorAll('.step-row').forEach((row, i) => {
    row.classList.remove('active', 'done');
    if (i === idx) row.classList.add('active');
    else if (i < idx) row.classList.add('done');
    const num = row.querySelector('.step-row-num');
    if (num) {
      num.style.background = i === idx ? 'var(--accent)' : i < idx ? 'var(--accent2)' : '';
      num.style.color = i <= idx ? '#fff' : '';
    }
  });

  // Scroll active step into view
  const activeRow = document.querySelector('.step-row.active');
  if (activeRow) activeRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

  // Buttons
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-first').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === STEPS.length - 1;
  document.getElementById('btn-last').disabled = idx === STEPS.length - 1;
}

//  INIT
// ─────────────────────────────────────────────
function init() {
  // Build steps list
  const listEl = document.getElementById('steps-list');
  STEPS.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'step-row';
    row.innerHTML = `<div class="step-row-num">${i + 1}</div><div>${s.title}</div>`;
    row.addEventListener('click', () => { currentStep = i; renderStep(i); });
    listEl.appendChild(row);
  });

  // Nav buttons
  document.getElementById('btn-first').addEventListener('click', () => { currentStep = 0; renderStep(0); });
  document.getElementById('btn-prev').addEventListener('click', () => {
    if (currentStep > 0) { currentStep--; renderStep(currentStep); }
  });
  document.getElementById('btn-next').addEventListener('click', () => {
    if (currentStep < STEPS.length - 1) { currentStep++; renderStep(currentStep); }
  });
  document.getElementById('btn-last').addEventListener('click', () => { currentStep = STEPS.length - 1; renderStep(currentStep); });

  // Keyboard nav
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      if (currentStep < STEPS.length - 1) { currentStep++; renderStep(currentStep); }
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      if (currentStep > 0) { currentStep--; renderStep(currentStep); }
    }
  });

  // Auto-play / Restart
  let autoPlayTimer = null;

  document.getElementById('speed-slider').addEventListener('input', function() {
    document.getElementById('speed-val').textContent = this.value + 'x';
    if (autoPlayTimer) {
      clearInterval(autoPlayTimer);
      autoPlayTimer = setInterval(advanceAutoPlay, getAutoPlayInterval());
    }
  });

  function advanceAutoPlay() {
    if (currentStep < STEPS.length - 1) {
      currentStep++;
      renderStep(currentStep);
    } else {
      clearInterval(autoPlayTimer);
      autoPlayTimer = null;
      document.getElementById('btn-autoplay').textContent = '\u25B6 Auto-play';
    }
  }

  document.getElementById('btn-autoplay').addEventListener('click', function() {
    if (autoPlayTimer) {
      clearInterval(autoPlayTimer);
      autoPlayTimer = null;
      this.textContent = '\u25B6 Auto-play';
    } else {
      this.textContent = '\u23F8 Pause';
      autoPlayTimer = setInterval(advanceAutoPlay, getAutoPlayInterval());
    }
  });

  document.getElementById('btn-restart').addEventListener('click', function() {
    if (autoPlayTimer) {
      clearInterval(autoPlayTimer);
      autoPlayTimer = null;
      document.getElementById('btn-autoplay').textContent = '\u25B6 Auto-play';
    }
    currentStep = 0;
    renderStep(0);
  });

  renderStep(0);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
